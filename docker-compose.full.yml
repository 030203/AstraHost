services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    container_name: roomos-ai-service
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 5001
      AI_SERVICE_DEBUG: "false"
      CONVERSATION_STORE_PATH: /data/conversations.json
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: 456456
      MYSQL_DATABASE: booking_system
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      NACOS_ENABLED: "false"
      NACOS_DISCOVERY_ENABLED: "false"
      NACOS_CONFIG_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5001:5001"
    volumes:
      - roomos-ai-data:/data
    restart: unless-stopped

  gateway:
    environment:
      AI_SERVICE_URL: http://ai-service:5001
    depends_on:
      ai-service:
        condition: service_started
