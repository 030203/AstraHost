worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  upstream gateway {
    server gateway:8088;
  }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://gateway/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ai-api/ {
      proxy_pass http://gateway/ai-api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /copilot {
      return 302 /copilot/;
    }

    location /copilot/ {
      proxy_pass http://gateway/ai-api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/copilot/ {
      proxy_pass http://gateway/ai-api/static/copilot/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(chat|conversations|suggestions|skills|__dev_reload__|health)(/.*)?$ {
      proxy_pass http://gateway/ai-api$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      root   /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
